apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: pulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: pulse
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: pulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: pulse
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pulse
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: pulse
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [pulse]
        relabel_configs:
          # only the Pulse pods (not nginx, mongo, kafka)
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: pulse
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          # scrape the metrics port of each pod IP
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            replacement: $1:9100
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pulse
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090