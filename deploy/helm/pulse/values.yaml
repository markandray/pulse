replicaCount: 3

image:
  repository: pulse
  tag: dev
  pullPolicy: IfNotPresent   # the image is loaded into kind, never pulled

terminationGracePeriodSeconds: 30   # must exceed SHUTDOWN_DELAY + the 8s shutdown budget

env:
  MONGO_URI: mongodb://mongo:27017
  KAFKA_BROKERS: kafka:9092
  PERSIST_INTERVAL: 1s
  SHUTDOWN_DELAY: 5s
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  TRACE_SAMPLE_RATIO: "1.0"   # lower this (0.01) before the load test

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nginx:
  enabled: true
  replicaCount: 2
  image: nginxinc/nginx-unprivileged:1.28-alpine
  nodePort: 30080
  workerConnections: 4096
  readTimeout: 3600s
